<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employee Directory</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: #f4f6fa;
      color: #1f2937;
    }
    .topbar {
      background: #1f2a44;
      color: #ffffff;
      padding: 18px 32px;
    }
    .topbar h1 { margin: 0; font-size: 1.35rem; font-weight: 600; letter-spacing: .3px; }
    .topbar p  { margin: 4px 0 0; font-size: .9rem; color: #aab4cc; }

    .container { max-width: 900px; margin: 32px auto; padding: 0 16px; }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      box-shadow: 0 2px 10px rgba(31, 42, 68, 0.08);
      overflow: hidden;
    }
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 16px 20px;
      border-bottom: 1px solid #e5e7eb;
    }
    .toolbar input {
      width: 260px;
      max-width: 100%;
      padding: 9px 12px;
      font-size: .95rem;
      border: 1px solid #cfd6e4;
      border-radius: 6px;
      outline: none;
    }
    .toolbar input:focus { border-color: #2f6fed; box-shadow: 0 0 0 3px rgba(47, 111, 237, .15); }
    #count { font-size: .9rem; color: #6b7280; }

    table { width: 100%; border-collapse: collapse; }
    th {
      background: #f8f9fc;
      color: #4b5563;
      font-size: .78rem;
      text-transform: uppercase;
      letter-spacing: .6px;
      text-align: left;
      padding: 12px 20px;
      border-bottom: 1px solid #e5e7eb;
    }
    td { padding: 14px 20px; border-bottom: 1px solid #eef0f4; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f1f5ff; }
    td:first-child { color: #2f6fed; font-weight: 600; }

    .empty { padding: 24px 20px; text-align: center; color: #6b7280; }
  </style>
</head>
<body>
  <header class="topbar">
    <h1>Employee Directory</h1>
    <p>Company staff information</p>
  </header>

  <main class="container">
    <div class="card">
      <div class="toolbar">
        <input type="text" id="search" placeholder="Search employees...">
        <span id="count"></span>
      </div>
      <table>
        <thead>
          <tr><th>ID</th><th>Name</th><th>Designation</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" hidden>No employees found.</div>
    </div>
  </main>

  <script>
    const tbody = document.getElementById("tbody");
    const count = document.getElementById("count");
    const empty = document.getElementById("empty");
    const search = document.getElementById("search");

    fetch("employees.xml")
      .then(r => r.text())
      .then(text => {
        const xml = new DOMParser().parseFromString(text, "application/xml");
        const employees = xml.getElementsByTagName("employee");
        for (const emp of employees) {
          const row = document.createElement("tr");
          for (const tag of ["id", "name", "designation"]) {
            const cell = document.createElement("td");
            cell.textContent = emp.getElementsByTagName(tag)[0].textContent;
            row.appendChild(cell);
          }
          tbody.appendChild(row);
        }
        updateCount();
      })
      .catch(() => {
        empty.hidden = false;
        empty.textContent = "Could not load employees.xml. Run the page with a local server.";
      });

    // Hide rows that do not match the search text
    search.addEventListener("input", function () {
      const q = search.value.toLowerCase();
      for (const row of tbody.rows) {
        row.hidden = !row.textContent.toLowerCase().includes(q);
      }
      updateCount();
    });

    function updateCount() {
      const total = tbody.rows.length;
      const shown = [...tbody.rows].filter(r => !r.hidden).length;
      count.textContent = "Showing " + shown + " of " + total + " employees";
      empty.hidden = shown !== 0;
      if (shown === 0) empty.textContent = "No employees found.";
    }
  </script>
</body>
</html>
